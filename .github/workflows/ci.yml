name: DataPilot AI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-tests:
    name: Backend Lint, Unit & PySpark Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Java 17 (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Verify Python compilation
        run: python -m compileall -q src tests scripts

      - name: Run Ruff lint check
        run: ruff check src tests aws scripts

      - name: Run unit, FastAPI, agent, AWS stub & PySpark tests
        run: pytest tests/test_config_and_generator.py tests/test_diagnostic_agent.py tests/test_aws_storage_and_glue.py tests/test_api.py tests/test_bronze_silver_gold.py tests/test_end_to_end_pipeline.py -v

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run production Vite build
        run: npm run build
