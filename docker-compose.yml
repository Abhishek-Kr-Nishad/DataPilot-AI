services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATAPILOT_EXECUTION_MODE: local
      DATAPILOT_METADATA_BACKEND: postgres
      POSTGRES_DSN: postgresql+psycopg2://datapilot:datapilot@postgres:5432/datapilot
      DATAPILOT_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datapilot-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: datapilot-postgres
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot
      POSTGRES_DB: datapilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 5s
      timeout: 5s
      retries: 5
